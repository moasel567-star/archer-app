{
  "name": "Build APK v18",
  "on": [
    "push",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Create app files",
          "run": "echo  | base64 -d | tar xz && rm -f app/src/main/res/xml/accessibility_config.xml && ls -R app | head -40"
        },
        {
          "name": "Use fixed signing key",
          "run": "mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "gradle/actions/setup-gradle@v4",
          "with": {
            "gradle-version": "8.9"
          }
        },
        {
          "name": "Build debug APK",
          "run": "gradle assembleDebug --no-daemon"
        },
        {
          "name": "Publish APK",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "tag_name": "v18-build-${{ github.run_number }}",
            "name": "Archer AI v18 (quiet mic, faster replies) build ${{ github.run_number }}",
            "files": "app/build/outputs/apk/debug/app-debug.apk"
          }
        }
      ]
    }
  }
}