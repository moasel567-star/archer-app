{"name": "Build APK", "on": ["push", "workflow_dispatch"], "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Get app files", "run": "curl -fsSL https://raw.githubusercontent.com/moasel567-star/archeria/main/app.tgz -o app.tgz || curl -fsSL https://moasel567-star.github.io/archeria/app.tgz -o app.tgz; tar xzf app.tgz; ls -R app | head -20"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Build", "run": "gradle assembleDebug --no-daemon"}, {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "files": "app/build/outputs/apk/debug/app-debug.apk"}}]}}}
